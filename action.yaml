name: Check Empty Files
description: Check that specified files are empty
author: Jonathan Dung
branding:
  icon: file-minus
  color: blue
inputs:
  clear:
    description: |
      Whether to make a pull request with each specified file cleared of content
      instead of failing the action in the case that some files are populated; the
      action will still fail if may-not-exist is true and at least one file is absent
      or an error propagates when operating on any file.
    default: <default>
  filenames:
    required: true
    description: |
      A newline-separated list of paths to files or directories to check for emptiness.
      For directories, "emptiness" means that all files given by a recursive traversal
      are empty, not that there are no files in the directory. Filenames are expected
      not to contain newlines or quotes, which I believe is reasonable, since such
      files already cause problems in many places.
  gh-branch-token:
    description: The token that the action will use to create and update the branch.
  gh-path:
    description: Relative path to the repository under GITHUB_WORKSPACE.
    default: ${{github.workspace}}
  gh-token:
    description: The token that the action will use to create the PR if needed.
    default: ${{github.token}}
  globs:
    description: |
      A newline-separated list of glob patterns to match files to check for emptiness.
  may-not-exist:
    description: Whether to allow the workflow to continue if any file is absent
    default: <default>
  pr-assignees:
    description: |
      A comma- or newline-delimited list of GitHub usernames to assign to the PR.
  pr-base:
    description: The pull request base branch.
    default: ${{github.ref_name}}
  pr-delete-branch:
    description: Whether to delete the branch after the PR is merged.
    default: 'true'
  pr-labels:
    description: A comma- or newline-delimited list of labels to apply to the PR.
  pr-reviewers:
    description: |
      A comma- or newline-delimited list of GitHub usernames to request review from.
  pr-sign-commits:
    description: Whether to sign the commit.
    default: 'true'
  pr-signoff:
    description: Whether to add a "Signed-off-by" line to the commit message.
    default: 'true'
  pr-title:
    description: |
      The title of the pull request to create if clear is true and some files are
      populated
    default: '[check-empty] clear empty files'
  push-to-fork:
    description: |
      The fork of the checked-out parent repository to which the pull request branch
      will be pushed (if any).
  python-version:
    description: |
      The version of Python to use; it is recommended to pass in the version in use in
      the workflow strategy matrix such that Python needs not be set up again if
      already present in the runner environment; the .python-version file is read if
      not passed as per @actions/setup-python behaviour.
  recurse-into:
    description: The numerical value of recurse_into passed to the check function.
    default: '0'
outputs:
  not_found:
    description: |
      A base64-encoded JSON string parsing to an array of paths to files that were not
      found.
    value: ${{steps.s.outputs.z}}
  io_errors:
    description: |
      A base64-encoded JSON string parsing to an array of I/O error messages
      encountered while making stat calls, checking file headers or writing to files in
      the process of checking and clearing files.
    value: ${{steps.s.outputs.w}}
  recursed_into:
    description: |
      A base64-encoded JSON string parsing to an array of paths to directories that
      were recursed into
    value: ${{steps.s.outputs.a}}
  empty_files:
    description: |
      A base64-encoded JSON string parsing to an array of paths to files that were
      found to be empty
    value: ${{steps.s.outputs.b}}
  non_empty_files:
    description: |
      A base64-encoded JSON string parsing to an object mapping paths to non-empty
      files to each of their sizes in bytes
    value: ${{steps.s.outputs.r}}
  num_not_found:
    description: The number of files that were not found
    value: ${{steps.s.outputs.x}}
  num_non_empty:
    description: The number of files that were found not to be empty
    value: ${{steps.s.outputs.y}}
  num_io_errors:
    description: The number of I/O errors encountered
    value: ${{steps.s.outputs.d}}
  num_empty:
    description: The number of files that were found to be empty
    value: ${{steps.s.outputs.p}}
  num_files:
    description: The total number of files checked
    value: ${{steps.s.outputs.n}}
  total_size:
    description: The total size in bytes of all files checked
    value: ${{steps.s.outputs.t}}
  pr:
    description: |
      Whether a pull request was created (i.e. there were non-empty files and clear was
      true, and the program succeeded)
    value: ${{steps.s.outputs.l}}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{inputs.python-version}}
    - id: s
      run: python ${{github.action_path}}/action.py
      shell: sh
      env:
        CE_CLEAR: ${{inputs.clear}}
        CE_FILENAMES: ${{inputs.filenames}}
        CE_GLOBS: ${{inputs.globs}}
        CE_MAY_NOT_EXIST: ${{inputs.may-not-exist}}
        CE_RECURSE_INTO: ${{inputs.recurse-into}}
    - if: steps.s.outputs.l == '1'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
      with:
        assignees: ${{inputs.pr-assignees}}
        base: ${{inputs.pr-base}}
        body: |
          Automated changes by
          [check-empty](https://github.com/jonathandung/check-empty).
        branch: check-empty/${{github.run_id}}
        delete-branch: ${{inputs.pr-delete-branch}}
        labels: ${{inputs.pr-labels}}
        push-to-fork: ${{inputs.push-to-fork}}
        reviewers: ${{inputs.pr-reviewers}}
        sign-commits: ${{inputs.pr-sign-commits}}
        signoff: ${{inputs.pr-signoff}}
        title: ${{inputs.pr-title}}
