name: Check Empty Files
description: Check that specified files are empty
author: Jonathan Dung
branding:
  icon: file-minus
  color: blue
inputs:
  clear:
    description: |
      Whether to make a pull request with each specified file cleared of content
      instead of failing the action in the case that some files are populated; the
      action will still fail if may-not-exist is true and at least one file is absent
    default: <default>
  filenames:
    required: true
    description: A newline-separated list of files or directories to check for emptiness
  may-not-exist:
    description: Whether to allow the workflow to continue if any file is absent
    default: <default>
  python-version:
    description: |
      The version of Python to use; can pass in the version in use in the matrix or
      similar such that Python needs not be set up again if already present in the
      runner environment
    default: "3.14"
  verbosity:
    description: The level of verbosity of the output
    default: "2"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6.3.0
      with:
        python-version: ${{inputs.python-version}}
    - run: python3 ${{github.action_path}}/action.py
      shell: bash
      env:
        CE_CLEAR: ${{inputs.clear}}
        CE_FILENAMES: ${{inputs.filenames}}
        CE_MAY_NOT_EXIST: ${{inputs.may-not-exist}}
        CE_VERBOSITY: ${{inputs.verbosity}}
