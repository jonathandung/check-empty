name: Build and publish
on:
  push: {tags: ["v[0-9]+.[0-9]+.[0-9]+"]}
jobs:
  publish:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/check-empty/${{github.ref_name}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
      - run: uv build
      - run: uv publish
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # zizmor: ignore[superfluous-actions]
        with:
          discussion_category_name: Releases
          generate_release_notes: true
    timeout-minutes: 5
