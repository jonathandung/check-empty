name: Build and publish
on:
  push:
    tags: [v*.*.*]
jobs:
  publish:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/check-empty/${{github.ref_name}}
    steps:
      - run: |
          NAME="${{github.ref_name}}"
          if [[ ! $NAME =~ ^[0-9]+\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$ ]]; then
            echo "Release name '$NAME' does not match the expected format 'X.Y.Z', with both Y and Z between 0 and 255"
            exit 1
          fi
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: uv build
      - run: uv publish
      - uses: softprops/action-gh-release@v3.0.2
        with:
          discussion_category_name: Releases
          generate-release-notes: true
          prerelease: true
