name: Build and publish
on:
  push: {tags: ["v[0-9]+.[0-9]+.[0-9]+"]}
jobs:
  publish:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/check-empty/${{github.ref_name}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
      - run: uv build
      - run: uv publish
      - run: gh release create "$TAG" --title "$TAG" --generate-notes --discussion-category "Releases"
        env:
          GH_TOKEN: ${{github.token}}
          TAG: ${{github.ref_name}}
    timeout-minutes: 3
