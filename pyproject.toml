[build-system]
requires = ["uv_build>=0.12.13"]
build-backend = "uv_build"

[dependency-groups]
docs = ["furo==2025.12.19", "sphinx==9.1.0", "sphinx-argparse-cli==1.22.1", "sphinx-copybutton==0.5.2", "sphinx-lint==1.0.2", "sphinx-notfound-page==1.1.0"]

[project]
authors = [{name = "Jonathan Dung", email = "jonathandung@yahoo.com"}]
classifiers = ["Development Status :: 5 - Production/Stable", "Environment :: Console", "Intended Audience :: Developers", "Natural Language :: English", "Operating System :: OS Independent", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Programming Language :: Python :: 3.15", "Programming Language :: Python :: 3.16", "Programming Language :: Python :: Free Threading :: 3 - Stable", "Topic :: Utilities", "Typing :: Typed"]
description = "Command-line utility, as well as a hook usable by the Python pre-commit framework, and a GitHub Action, to ensure that selected files are empty."
keywords = ["check", "command-line", "empty", "files", "github-action", "helper", "hook", "lightweight", "pre-commit", "prek", "tool", "utility"]
license = "MIT"
license-files = ["LICENSE", "AUTHORS.md"]
maintainers = [{name = "Jonathan Dung", email = "jonathandung@yahoo.com"}]
name = "check-empty"
readme = "README.md"
requires-python = ">=3.7"
version = "1.3.0"

[project.optional-dependencies]
"7z" = ["py7zr==1.1.3; python_version >= '3.10'", "py7zr==1.0.0; python_version == '3.9'", "py7zr==0.22.0; python_version == '3.8'", "py7zr==0.20.6; python_version == '3.7'"]
all = ["check-empty[7z,lzh,rar]==1.3.0"]
lzh = ["lhafile==0.3.1"]
rar = ["rarfile==4.5; python_version >= '3.10'", "rarfile==4.2; python_version < '3.10'"]

[project.scripts]
check-empty = "check_empty.__main__:main"

[tool.ruff]
required-version = ">=0.16.7"
target-version = "py37"

[tool.ruff.analyze]
type-checking-imports = false

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
ignore = ["COM", "FBT", "PT", "avoidable-escaped-quote", "bad-quotes-inline-string", "builtin-open", "complex-structure", "docstring-extraneous-exception", "implicit-namespace-package", "import-outside-top-level", "incorrect-blank-line-before-class", "multi-line-summary-second-line", "non-empty-init-module", "print", "too-many-branches", "too-many-locals", "too-many-statements", "unnecessary-dunder-call"]
preview = true
select = ["ALL"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"test_check_empty.py" = ["ANN", "D"]
"!__init__.py" = ["missing-copyright-notice"]
"__main__.py" = ["missing-return-type-private-function"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 6
max-nested-blocks = 6

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.environment]
python-version = "3.7"
python-platform = "all"

[tool.ty.rules]
all = "error"
missing-override-decorator = "ignore"

[[tool.ty.overrides]]
include = ["check_empty/__init__.py"]
rules = {redundant-condition = "ignore", unsound-assignment = "ignore"}

[tool.uv]
required-version = ">=0.12.13"

[tool.uv.audit]
ignore = [
  "GHSA-gjrg-mpp7-g774",
  "GHSA-h4gh-22qq-72r7",
  "GHSA-q6rc-2cgv-63h7",
  "GHSA-gjrg-mpp7-g774",
  "GHSA-h4gh-22qq-72r7",
  "GHSA-q6rc-2cgv-63h7",
  "GHSA-gjrg-mpp7-g774",
  "GHSA-h4gh-22qq-72r7",
  "GHSA-q6rc-2cgv-63h7",
  "GHSA-jfmj-5v4g-7637",
]

[tool.uv.build-backend]
module-name = "check_empty"
module-root = ""

[tool.uv.dependency-groups]
docs = {requires-python = ">=3.12"}
