[build-system]
requires = ["uv_build>=0.12.5"]
build-backend = "uv_build"

[project]
authors = [{name = "Jonathan Dung", email = "jonathandung@yahoo.com"}]
classifiers = ["Development Status :: 4 - Beta", "Environment :: Console", "Intended Audience :: Developers", "Natural Language :: English", "Operating System :: OS Independent", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Programming Language :: Python :: 3.15", "Programming Language :: Python :: Free Threading :: 3 - Stable", "Topic :: Utilities", "Typing :: Typed"]
description = "Command-line utility, as well as a hook usable by the Python pre-commit framework and a GitHub Action, to ensure that selected files are empty."
keywords = ["check", "command-line", "empty", "files", "github-action", "helper", "hook", "lightweight", "pre-commit", "prek", "tool", "utility"]
license = "MIT"
license-files = ["LICENSE", "AUTHORS.md"]
maintainers = [{name = "Jonathan Dung", email = "jonathandung@yahoo.com"}]
name = "check-empty"
readme = "README.md"
requires-python = ">=3.6"
version = "1.0.1"

[project.scripts]
check-empty = "check_empty.__main__:main"

[tool.ruff]
target-version = "py37"

[tool.ruff.analyze]
type-checking-imports = false

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
ignore = ["ANN", "COM", "FBT", "PT", "PTH", "avoidable-escaped-quote", "bad-quotes-inline-string", "complex-structure", "docstring-extraneous-exception", "import-outside-top-level", "incorrect-blank-line-before-class", "magic-value-comparison", "multi-line-summary-second-line", "non-empty-init-module", "print", "unnecessary-dunder-call"]
preview = true
select = ["ALL"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"test_check_empty.py" = ["D"]
"!__init__.py" = ["missing-copyright-notice"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.environment]
python-version = "3.7"
python-platform = "all"

[tool.ty.rules]
all = "error"
missing-override-decorator = "ignore"

[tool.uv]
required-version = ">=0.12.5"

[tool.uv.build-backend]
module-name = "check_empty"
module-root = ""
